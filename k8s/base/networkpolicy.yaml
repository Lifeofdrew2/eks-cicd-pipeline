# Default-deny for the namespace, then allow only what the app needs.
# Enforced by the VPC CNI (enableNetworkPolicy = "true" in the aws-eks-platform repo).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: demo-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: demo-api
  policyTypes: ["Ingress", "Egress"]
  ingress:
    # ALB (target-type: ip) and in-cluster callers such as Prometheus
    # connect from inside the VPC CIDR.
    - from:
        - ipBlock:
            cidr: 10.0.0.0/16
      ports:
        - port: 8080
          protocol: TCP
  egress:
    # DNS only - the service makes no other outbound calls.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
