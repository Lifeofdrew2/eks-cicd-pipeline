apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: demo-staging
resources:
  - ../../base
labels:
  - pairs:
      environment: staging
patches:
  # Staging runs a smaller footprint than production.
  - target:
      kind: Deployment
      name: demo-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: HorizontalPodAutoscaler
      name: demo-api
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 4
  - target:
      kind: PodDisruptionBudget
      name: demo-api
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 1
images:
  # The pipeline replaces this with <ecr-repo>:<git-sha> at deploy time.
  - name: demo-api
    newName: demo-api
    newTag: set-by-pipeline
