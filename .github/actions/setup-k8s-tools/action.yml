name: Set up Kubernetes tools
description: Install pinned versions of kustomize and kubeconform onto the PATH.
inputs:
  kustomize-version:
    default: "5.6.0"
    description: kustomize release to install
  kubeconform-version:
    default: "0.6.7"
    description: kubeconform release to install
runs:
  using: composite
  steps:
    - shell: bash
      env:
        KUSTOMIZE_VERSION: ${{ inputs.kustomize-version }}
        KUBECONFORM_VERSION: ${{ inputs.kubeconform-version }}
      run: |
        mkdir -p "$HOME/.local/bin"
        curl -sSfL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
          | tar xz -C "$HOME/.local/bin" kustomize
        curl -sSfL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
          | tar xz -C "$HOME/.local/bin" kubeconform
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
